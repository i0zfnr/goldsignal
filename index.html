<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0f">
    <meta name="description" content="Xeniex — XAUUSD M15 trade signals, live market terminal, performance and risk tools.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Xeniex">
    <meta name="format-detection" content="telephone=no">
    <script>
      try {
        var t = localStorage.getItem("xeniex-theme");
        if (t === "dark" || t === null) {
          document.documentElement.dataset.theme = "dark";
        } else {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#ffffff";
        }
      } catch {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/app-icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/app-icon-192.png">
    <title>Xeniex | XAUUSD Terminal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
